<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Аллерой Доставка</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .top-panel {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            z-index: 1000;
            background: white;
            border-radius: 15px;
            padding: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.25);
        }

        .title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .address {
            font-size: 14px;
            color: #333;
            line-height: 1.35;
        }

        .bottom-panel {
            position: fixed;
            left: 10px;
            right: 10px;
            bottom: 15px;
            z-index: 1000;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 15px;
            padding: 16px;
            margin-top: 8px;
            font-size: 17px;
            font-weight: bold;
        }

        .location-button {
            background: white;
            box-shadow: 0 3px 15px rgba(0,0,0,0.25);
        }

        .choose-button {
            background: #1687ff;
            color: white;
            box-shadow: 0 3px 15px rgba(0,0,0,0.25);
        }

        .status {
            background: white;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 8px;
            text-align: center;
            box-shadow: 0 3px 15px rgba(0,0,0,0.20);
            font-size: 14px;
        }

    </style>
</head>

<body>

<div class="top-panel">

    <div class="title">
        🚚 Аллерой Доставка
    </div>

    <div class="address" id="address">
        📍 Определяем адрес...
    </div>

</div>

<div id="map"></div>

<div class="bottom-panel">

    <div class="status" id="status">
        📍 Готово к выбору места
    </div>

    <button
        class="location-button"
        onclick="myLocation()">
        📍 Моё местоположение
    </button>

    <button
        class="choose-button"
        onclick="choosePlace()">
        ✅ Выбрать это место
    </button>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let tg = null;

if (
    window.Telegram &&
    window.Telegram.WebApp
) {

    tg = window.Telegram.WebApp;

    tg.ready();

    tg.expand();

    document.getElementById(
        "status"
    ).innerText =
        "✅ Карта подключена к Telegram";

}


/* ==========================================
   НАЧАЛЬНАЯ ТОЧКА
========================================== */

const defaultLat = 43.3178;
const defaultLon = 45.6980;


/* ==========================================
   КАРТА
========================================== */

const map = L.map(
    "map"
).setView(
    [
        defaultLat,
        defaultLon
    ],
    13
);


/* ==========================================
   OPENSTREETMAP
========================================== */

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap"
    }
).addTo(map);


/* ==========================================
   ЦЕНТРАЛЬНАЯ ТОЧКА
========================================== */

let marker = L.marker(
    [
        defaultLat,
        defaultLon
    ]
).addTo(map);


/* ==========================================
   КООРДИНАТЫ
========================================== */

let selectedLat = defaultLat;
let selectedLon = defaultLon;

let selectedAddress = "Точка на карте";


/* ==========================================
   ДВИЖЕНИЕ КАРТЫ
========================================== */

map.on(
    "move",
    function() {

        const center =
            map.getCenter();

        selectedLat =
            center.lat;

        selectedLon =
            center.lng;

        marker.setLatLng(
            [
                selectedLat,
                selectedLon
            ]
        );

    }
);


/* ==========================================
   КАРТА ОСТАНОВИЛАСЬ
========================================== */

map.on(
    "moveend",
    function() {

        const center =
            map.getCenter();

        selectedLat =
            center.lat;

        selectedLon =
            center.lng;

        marker.setLatLng(
            [
                selectedLat,
                selectedLon
            ]
        );

        getAddress(
            selectedLat,
            selectedLon
        );

    }
);


/* ==========================================
   АДРЕС
========================================== */

function getAddress(
    lat,
    lon
) {

    document.getElementById(
        "address"
    ).innerText =
        "📍 Определяем адрес...";


    const url =
        "https://nominatim.openstreetmap.org/reverse"
        +
        "?format=json"
        +
        "&lat="
        + encodeURIComponent(lat)
        +
        "&lon="
        + encodeURIComponent(lon)
        +
        "&zoom=18"
        +
        "&addressdetails=1";


    fetch(url)

    .then(
        function(response) {

            return response.json();

        }
    )

    .then(
        function(data) {

            if (
                data &&
                data.display_name
            ) {

                selectedAddress =
                    data.display_name;

                document.getElementById(
                    "address"
                ).innerText =
                    "📍 "
                    +
                    selectedAddress;

            }

            else {

                selectedAddress =
                    "Точка на карте";

                document.getElementById(
                    "address"
                ).innerText =
                    "📍 Точка на карте";

            }

        }
    )

    .catch(
        function() {

            selectedAddress =
                "Точка на карте";

            document.getElementById(
                "address"
            ).innerText =
                "📍 Точка на карте";

        }
    );

}


/* ==========================================
   МОЁ МЕСТОПОЛОЖЕНИЕ
========================================== */

function myLocation() {

    if (
        !navigator.geolocation
    ) {

        document.getElementById(
            "status"
        ).innerText =
            "⚠️ Геолокация недоступна.";

        return;

    }


    document.getElementById(
        "status"
    ).innerText =
        "📍 Получаем местоположение...";


    navigator.geolocation.getCurrentPosition(

        function(position) {

            const lat =
                position.coords.latitude;

            const lon =
                position.coords.longitude;


            selectedLat = lat;
            selectedLon = lon;


            map.setView(
                [
                    lat,
                    lon
                ],
                16
            );


            marker.setLatLng(
                [
                    lat,
                    lon
                ]
            );


            document.getElementById(
                "status"
            ).innerText =
                "✅ Местоположение найдено";


            getAddress(
                lat,
                lon
            );

        },

        function() {

            document.getElementById(
                "status"
            ).innerText =
                "⚠️ Не удалось получить геопозицию.";

        },

        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }

    );

}


/* ==========================================
   ВЫБРАТЬ МЕСТО
========================================== */

function choosePlace() {

    const lat =
        Number(selectedLat);

    const lon =
        Number(selectedLon);


    if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lon)
    ) {

        document.getElementById(
            "status"
        ).innerText =
            "⚠️ Координаты не определены.";

        return;

    }


    if (!tg) {

        document.getElementById(
            "status"
        ).innerText =
            "⚠️ Telegram Mini App не подключён.";

        return;

    }


    let address =
        selectedAddress;


    if (
        !address ||
        address === "Точка на карте"
    ) {

        address =
            "Точка на карте";

    }


    /*
    ==========================================
    ДАННЫЕ ДЛЯ БОТА
    ==========================================
    */

    const data =
        "DESTINATION"
        +
        "|"
        +
        lat.toFixed(6)
        +
        "|"
        +
        lon.toFixed(6)
        +
        "|"
        +
        address;


    document.getElementById(
        "status"
    ).innerText =
        "📤 Передаём точку боту...";


    try {

        tg.sendData(
            data
        );

    }

    catch (error) {

        document.getElementById(
            "status"
        ).innerText =
            "⚠️ Не удалось передать точку.";

    }

}


/* ==========================================
   ПЕРВИЧНЫЙ АДРЕС
========================================== */

getAddress(
    selectedLat,
    selectedLon
);

</script>

</body>
</html>
