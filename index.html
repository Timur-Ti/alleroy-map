<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Аллерой Доставка</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .top {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            z-index: 1000;
            background: white;
            padding: 12px;
            border-radius: 14px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.25);
        }

        .title {
            font-size: 18px;
            font-weight: bold;
        }

        .address {
            margin-top: 6px;
            font-size: 13px;
        }

        .bottom {
            position: fixed;
            left: 10px;
            right: 10px;
            bottom: 15px;
            z-index: 1000;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 14px;
            padding: 15px;
            margin-top: 8px;
            font-size: 17px;
            font-weight: bold;
        }

        .location {
            background: white;
            box-shadow: 0 3px 15px rgba(0,0,0,0.25);
        }

        .choose {
            background: #1687ff;
            color: white;
            box-shadow: 0 3px 15px rgba(0,0,0,0.25);
        }

        .status {
            background: white;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 15px rgba(0,0,0,0.20);
        }
    </style>
</head>

<body>

<div class="top">

    <div class="title">
        🚚 Аллерой Доставка
    </div>

    <div
        class="address"
        id="address"
    >
        📍 Передвиньте карту и выберите место
    </div>

</div>

<div id="map"></div>

<div class="bottom">

    <div
        class="status"
        id="status"
    >
        📍 Карта готова
    </div>

    <button
        class="location"
        onclick="myLocation()"
    >
        📍 Моё местоположение
    </button>

    <button
        class="choose"
        onclick="choosePlace()"
    >
        ✅ Выбрать это место
    </button>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

var tg = null;

if (
    window.Telegram &&
    window.Telegram.WebApp
) {

    tg = window.Telegram.WebApp;

    tg.ready();

    tg.expand();

}


/*
==========================================
НАЧАЛЬНАЯ ТОЧКА
==========================================
*/

var defaultLat = 43.3178;

var defaultLon = 45.6980;


/*
==========================================
КАРТА
==========================================
*/

var map = L.map("map").setView(
    [
        defaultLat,
        defaultLon
    ],
    13
);


/*
==========================================
OPENSTREETMAP
==========================================
*/

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap"
    }
).addTo(map);


/*
==========================================
МАРКЕР
==========================================
*/

var marker = L.marker(
    [
        defaultLat,
        defaultLon
    ]
).addTo(map);


/*
==========================================
ТЕКУЩАЯ ТОЧКА
==========================================
*/

var selectedLat = defaultLat;

var selectedLon = defaultLon;


/*
==========================================
ДВИЖЕНИЕ КАРТЫ
==========================================
*/

map.on(
    "move",
    function() {

        var center = map.getCenter();

        selectedLat = center.lat;

        selectedLon = center.lng;

        marker.setLatLng(
            [
                selectedLat,
                selectedLon
            ]
        );

    }
);


/*
==========================================
АДРЕС
==========================================
*/

map.on(
    "moveend",
    function() {

        getAddress(
            selectedLat,
            selectedLon
        );

    }
);


function getAddress(
    lat,
    lon
) {

    document.getElementById(
        "address"
    ).innerText =
        "📍 Определяем адрес...";


    var url =
        "https://nominatim.openstreetmap.org/reverse"
        +
        "?format=json"
        +
        "&lat="
        +
        encodeURIComponent(lat)
        +
        "&lon="
        +
        encodeURIComponent(lon)
        +
        "&zoom=18"
        +
        "&addressdetails=1";


    fetch(url)

    .then(
        function(response) {

            return response.json();

        }
    )

    .then(
        function(data) {

            if (
                data &&
                data.display_name
            ) {

                document.getElementById(
                    "address"
                ).innerText =
                    "📍 "
                    +
                    data.display_name;

            }

            else {

                document.getElementById(
                    "address"
                ).innerText =
                    "📍 Адрес не найден";

            }

        }
    )

    .catch(
        function() {

            document.getElementById(
                "address"
            ).innerText =
                "📍 Адрес не определён";

        }
    );

}


/*
==========================================
МОЁ МЕСТОПОЛОЖЕНИЕ
==========================================
*/

function myLocation() {

    if (
        !navigator.geolocation
    ) {

        document.getElementById(
            "status"
        ).innerText =
            "⚠️ Геолокация недоступна.";

        return;

    }


    document.getElementById(
        "status"
    ).innerText =
        "📍 Получаем местоположение...";


    navigator.geolocation.getCurrentPosition(

        function(position) {

            selectedLat =
                position.coords.latitude;

            selectedLon =
                position.coords.longitude;


            map.setView(
                [
                    selectedLat,
                    selectedLon
                ],
                16
            );


            marker.setLatLng(
                [
                    selectedLat,
                    selectedLon
                ]
            );


            document.getElementById(
                "status"
            ).innerText =
                "✅ Местоположение найдено";


            getAddress(
                selectedLat,
                selectedLon
            );

        },

        function() {

            document.getElementById(
                "status"
            ).innerText =
                "⚠️ Не удалось получить геопозицию.";

        },

        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }

    );

}


/*
==========================================
ВЫБРАТЬ МЕСТО
==========================================
*/

function choosePlace() {

    var lat =
        Number(selectedLat);

    var lon =
        Number(selectedLon);


    if (
        !isFinite(lat) ||
        !isFinite(lon)
    ) {

        document.getElementById(
            "status"
        ).innerText =
            "⚠️ Координаты не определены.";

        return;

    }


    /*
    ======================================
    ОТПРАВЛЯЕМ ТОЛЬКО КООРДИНАТЫ
    ======================================
    */

    var data =
        "DESTINATION"
        +
        "|"
        +
        lat.toFixed(6)
        +
        "|"
        +
        lon.toFixed(6);


    document.getElementById(
        "status"
    ).innerText =
        "📤 Передаём точку в Telegram...";


    /*
    ======================================
    TELEGRAM MINI APP
    ======================================
    */

    if (
        tg &&
        typeof tg.sendData === "function"
    ) {

        tg.sendData(data);

    }

    else {

        document.getElementById(
            "status"
        ).innerText =
            "⚠️ Карта открыта не как Telegram Mini App.";

    }

}


/*
==========================================
ПЕРВЫЙ АДРЕС
==========================================
*/

getAddress(
    selectedLat,
    selectedLon
);

</script>

</body>
</html>
