<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Аллерой Доставка — Карта</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background: #ffffff;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .top-panel {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            z-index: 1000;
            background: white;
            border-radius: 14px;
            padding: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.25);
        }

        .title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .address {
            font-size: 14px;
            color: #333333;
            min-height: 20px;
        }

        .bottom-panel {
            position: fixed;
            left: 10px;
            right: 10px;
            bottom: 15px;
            z-index: 1000;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 15px;
            margin-top: 8px;
            font-size: 17px;
            font-weight: bold;
        }

        .location-button {
            background: #ffffff;
            box-shadow: 0 3px 15px rgba(0,0,0,0.25);
        }

        .choose-button {
            background: #1687ff;
            color: white;
            box-shadow: 0 3px 15px rgba(0,0,0,0.25);
        }

        .status {
            background: white;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 8px;
            text-align: center;
            box-shadow: 0 3px 15px rgba(0,0,0,0.20);
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="top-panel">

    <div class="title">
        🚚 Аллерой Доставка
    </div>

    <div class="address" id="address">
        📍 Переместите карту и выберите место
    </div>

</div>


<div id="map"></div>


<div class="bottom-panel">

    <div
        class="status"
        id="status"
    >
        📍 Определяем ваше местоположение...
    </div>

    <button
        class="location-button"
        onclick="myLocation()"
    >
        📍 Моё местоположение
    </button>

    <button
        class="choose-button"
        onclick="choosePlace()"
    >
        ✅ Выбрать это место
    </button>

</div>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

    /*
    ==========================================
    TELEGRAM
    ==========================================
    */

    const tg = window.Telegram
        ? window.Telegram.WebApp
        : null;


    if (tg) {

        tg.ready();

        tg.expand();

    }


    /*
    ==========================================
    НАЧАЛЬНЫЕ КООРДИНАТЫ
    ==========================================
    */

    const defaultLat = 43.3178;

    const defaultLon = 45.6980;


    /*
    ==========================================
    СОЗДАЁМ КАРТУ
    ==========================================
    */

    const map = L.map(
        "map"
    ).setView(
        [
            defaultLat,
            defaultLon
        ],
        13
    );


    /*
    ==========================================
    OPENSTREETMAP
    ==========================================
    */

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,

            attribution:
                "&copy; OpenStreetMap"
        }
    ).addTo(map);


    /*
    ==========================================
    МАРКЕР
    ==========================================
    */

    let marker = L.marker(
        [
            defaultLat,
            defaultLon
        ],
        {
            draggable: false
        }
    ).addTo(map);


    /*
    ==========================================
    ВЫБРАННЫЕ КООРДИНАТЫ
    ==========================================
    */

    let selectedLat = defaultLat;

    let selectedLon = defaultLon;

    let selectedAddress =
        "Адрес определяется...";


    /*
    ==========================================
    ЦЕНТРИРУЕМ МАРКЕР
    ==========================================
    */

    map.on(
        "move",
        function () {

            const center =
                map.getCenter();

            selectedLat =
                center.lat;

            selectedLon =
                center.lng;

            marker.setLatLng(
                [
                    selectedLat,
                    selectedLon
                ]
            );

        }
    );


    /*
    ==========================================
    ПОСЛЕ ОСТАНОВКИ КАРТЫ
    ПОЛУЧАЕМ АДРЕС
    ==========================================
    */

    map.on(
        "moveend",
        function () {

            const center =
                map.getCenter();

            selectedLat =
                center.lat;

            selectedLon =
                center.lng;

            getAddress(
                selectedLat,
                selectedLon
            );

        }
    );


    /*
    ==========================================
    ПОЛУЧЕНИЕ АДРЕСА
    ==========================================
    */

    function getAddress(
        lat,
        lon
    ) {

        document.getElementById(
            "address"
        ).innerText =
            "📍 Определяем адрес...";


        const url =
            "https://nominatim.openstreetmap.org/reverse"
            +
            "?format=json"
            +
            "&lat="
            + encodeURIComponent(lat)
            +
            "&lon="
            + encodeURIComponent(lon)
            +
            "&zoom=18"
            +
            "&addressdetails=1";


        fetch(
            url,
            {
                headers: {
                    "Accept":
                        "application/json"
                }
            }
        )

        .then(
            function(response) {

                return response.json();

            }
        )

        .then(
            function(data) {

                if (
                    data &&
                    data.display_name
                ) {

                    selectedAddress =
                        data.display_name;

                    document.getElementById(
                        "address"
                    ).innerText =
                        "📍 "
                        +
                        selectedAddress;

                }

                else {

                    selectedAddress =
                        "Адрес не найден";

                    document.getElementById(
                        "address"
                    ).innerText =
                        "📍 Адрес не найден";

                }

            }
        )

        .catch(
            function() {

                selectedAddress =
                    "Адрес не определён";

                document.getElementById(
                    "address"
                ).innerText =
                    "📍 Адрес не определён";

            }
        );

    }


    /*
    ==========================================
    МОЁ МЕСТОПОЛОЖЕНИЕ
    ==========================================
    */

    function myLocation() {

        if (
            !navigator.geolocation
        ) {

            document.getElementById(
                "status"
            ).innerText =
                "⚠️ Геолокация недоступна.";

            return;

        }


        document.getElementById(
            "status"
        ).innerText =
            "📍 Получаем местоположение...";


        navigator.geolocation.getCurrentPosition(

            function(position) {

                const lat =
                    position.coords.latitude;

                const lon =
                    position.coords.longitude;


                selectedLat = lat;

                selectedLon = lon;


                map.setView(
                    [
                        lat,
                        lon
                    ],
                    16
                );


                marker.setLatLng(
                    [
                        lat,
                        lon
                    ]
                );


                document.getElementById(
                    "status"
                ).innerText =
                    "✅ Местоположение найдено";


                getAddress(
                    lat,
                    lon
                );

            },

            function() {

                document.getElementById(
                    "status"
                ).innerText =
                    "⚠️ Не удалось получить геопозицию.";

            },

            {
                enableHighAccuracy: true,

                timeout: 10000,

                maximumAge: 0
            }

        );

    }


    /*
    ==========================================
    ВЫБОР МЕСТА
    ==========================================
    */

    function choosePlace() {

        const lat =
            Number(
                selectedLat
            );

        const lon =
            Number(
                selectedLon
            );


        if (
            !lat ||
            !lon
        ) {

            document.getElementById(
                "status"
            ).innerText =
                "⚠️ Сначала выберите место.";

            return;

        }


        let address =
            selectedAddress;


        if (
            !address ||
            address ===
            "Адрес определяется..."
        ) {

            address =
                "Точка на карте";

        }


        /*
        ======================================
        ФОРМИРУЕМ ДАННЫЕ ДЛЯ БОТА
        ======================================
        */

        const data =
            "DESTINATION"
            +
            "|"
            +
            lat.toFixed(6)
            +
            "|"
            +
            lon.toFixed(6)
            +
            "|"
            +
            address;


        /*
        ======================================
        ОТПРАВЛЯЕМ В TELEGRAM
        ======================================
        */

        if (
            tg &&
            tg.sendData
        ) {

            document.getElementById(
                "status"
            ).innerText =
                "✅ Отправляем выбранное место...";


            tg.sendData(
                data
            );


            /*
            Telegram сам закроет
            Mini App после sendData.
            */

        }

        else {

            document.getElementById(
                "status"
            ).innerText =
                "⚠️ Карта открыта не через Telegram.";

        }

    }


    /*
    ==========================================
    ПЕРВИЧНО ПОЛУЧАЕМ АДРЕС
    ==========================================
    */

    getAddress(
        selectedLat,
        selectedLon
    );


</script>

</body>
</html>
