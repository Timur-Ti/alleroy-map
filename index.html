<!DOCTYPE html>
<html lang="ru">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Аллерой Доставка</title>

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            font-family: Arial, sans-serif;

            overflow: hidden;

            background: #f2f2f2;
        }

        #map {

            position: fixed;

            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            width: 100%;
            height: 100%;

            z-index: 1;
        }

        .top-panel {

            position: fixed;

            top: 10px;
            left: 10px;
            right: 10px;

            z-index: 1000;

            background: white;

            border-radius: 16px;

            padding: 13px 15px;

            box-shadow:
                0 3px 16px
                rgba(0,0,0,0.25);
        }

        .title {

            font-size: 18px;

            font-weight: bold;

            margin-bottom: 7px;
        }

        .address {

            font-size: 14px;

            color: #333;

            line-height: 1.35;
        }

        .route-info {

            margin-top: 8px;

            padding-top: 8px;

            border-top: 1px solid #eee;

            font-size: 14px;

            font-weight: bold;
        }

        .bottom-panel {

            position: fixed;

            left: 10px;
            right: 10px;

            bottom: 15px;

            z-index: 1000;
        }

        .status {

            background: white;

            border-radius: 13px;

            padding: 10px;

            margin-bottom: 8px;

            text-align: center;

            box-shadow:
                0 3px 15px
                rgba(0,0,0,0.20);

            font-size: 14px;
        }

        button {

            width: 100%;

            border: none;

            border-radius: 15px;

            padding: 16px;

            margin-top: 8px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        .location-button {

            background: white;

            color: #222;

            box-shadow:
                0 3px 15px
                rgba(0,0,0,0.25);
        }

        .choose-button {

            background: #1687ff;

            color: white;

            box-shadow:
                0 3px 15px
                rgba(0,0,0,0.25);
        }

        .choose-button:disabled {

            background: #9bbfe5;

            color: white;

        }

    </style>

</head>

<body>


<div class="top-panel">

    <div class="title">

        🚚 Аллерой Доставка

    </div>

    <div
        class="address"
        id="address"
    >

        🏁 Выберите место назначения

    </div>

    <div
        class="route-info"
        id="routeInfo"
    >

        📏 Расстояние: рассчитывается после выбора

    </div>

</div>


<div id="map"></div>


<div class="bottom-panel">

    <div
        class="status"
        id="status"
    >

        📍 Передвиньте карту и выберите место назначения

    </div>

    <button
        class="location-button"
        onclick="myLocation()"
    >

        📍 Моё местоположение

    </button>

    <button
        class="choose-button"
        id="chooseButton"
        onclick="choosePlace()"
    >

        ✅ Выбрать это место

    </button>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/*
==================================================
TELEGRAM MINI APP
==================================================
*/

let tg = null;

if (
    window.Telegram &&
    window.Telegram.WebApp
) {

    tg = window.Telegram.WebApp;

    tg.ready();

    tg.expand();

}


/*
==================================================
ПОЛУЧАЕМ КООРДИНАТЫ ОТПРАВЛЕНИЯ
ИЗ URL
==================================================
*/

const params =
    new URLSearchParams(
        window.location.search
    );


let fromLat =
    parseFloat(
        params.get("from_lat")
    );


let fromLon =
    parseFloat(
        params.get("from_lon")
    );


/*
==================================================
ЕСЛИ КООРДИНАТЫ НЕ ПЕРЕДАНЫ
==================================================
*/

const defaultLat =
    43.3178;


const defaultLon =
    45.6980;


if (
    !Number.isFinite(fromLat) ||
    !Number.isFinite(fromLon)
) {

    fromLat =
        defaultLat;

    fromLon =
        defaultLon;

}


/*
==================================================
НАЧАЛЬНАЯ ТОЧКА
==================================================
*/

const map =
    L.map(
        "map"
    ).setView(
        [
            fromLat,
            fromLon
        ],
        15
    );


/*
==================================================
OPENSTREETMAP
==================================================
*/

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {

        maxZoom: 19,

        attribution:
            "&copy; OpenStreetMap"

    }
).addTo(map);


/*
==================================================
ТОЧКА ОТПРАВЛЕНИЯ
==================================================
*/

const fromMarker =
    L.marker(
        [
            fromLat,
            fromLon
        ]
    ).addTo(map);


fromMarker.bindPopup(
    "📍 Место отправления"
);


/*
==================================================
МАРКЕР НАЗНАЧЕНИЯ
==================================================
*/

let marker =
    L.marker(
        [
            fromLat,
            fromLon
        ]
    ).addTo(map);


marker.bindPopup(
    "🏁 Место назначения"
);


/*
==================================================
ВЫБРАННЫЕ КООРДИНАТЫ
==================================================
*/

let selectedLat =
    fromLat;


let selectedLon =
    fromLon;


let selectedAddress =
    "Точка на карте";


/*
==================================================
РАЗРЕШЕНА ЛИ ОТПРАВКА
==================================================
*/

let canSend =
    false;


/*
==================================================
КНОПКА
==================================================
*/

const chooseButton =
    document.getElementById(
        "chooseButton"
    );


chooseButton.disabled =
    false;


/*
==================================================
ПОЛУЧЕНИЕ АДРЕСА
==================================================
*/

function getAddress(
    lat,
    lon
) {

    document.getElementById(
        "address"
    ).innerText =
        "📍 Определяем адрес...";


    const url =
        "https://nominatim.openstreetmap.org/reverse"
        +
        "?format=json"
        +
        "&lat="
        +
        encodeURIComponent(lat)
        +
        "&lon="
        +
        encodeURIComponent(lon)
        +
        "&zoom=18"
        +
        "&addressdetails=1";


    fetch(
        url,
        {
            headers: {
                "Accept":
                    "application/json"
            }
        }
    )

    .then(
        function(response) {

            return response.json();

        }
    )

    .then(
        function(data) {

            if (
                data &&
                data.display_name
            ) {

                selectedAddress =
                    data.display_name;


                document.getElementById(
                    "address"
                ).innerText =
                    "🏁 "
                    +
                    selectedAddress;

            }

            else {

                selectedAddress =
                    "Точка на карте";

                document.getElementById(
                    "address"
                ).innerText =
                    "🏁 Точка на карте";

            }

            canSend =
                true;

        }
    )

    .catch(
        function() {

            selectedAddress =
                "Точка на карте";


            document.getElementById(
                "address"
            ).innerText =
                "🏁 Точка на карте";


            canSend =
                true;

        }
    );

}


/*
==================================================
ДВИЖЕНИЕ КАРТЫ
==================================================
*/

map.on(
    "move",
    function() {

        const center =
            map.getCenter();


        selectedLat =
            center.lat;


        selectedLon =
            center.lng;


        marker.setLatLng(
            [
                selectedLat,
                selectedLon
            ]
        );

    }
);


/*
==================================================
КАРТА ОСТАНОВИЛАСЬ
==================================================
*/

map.on(
    "moveend",
    function() {

        const center =
            map.getCenter();


        selectedLat =
            center.lat;


        selectedLon =
            center.lng;


        marker.setLatLng(
            [
                selectedLat,
                selectedLon
            ]
        );


        canSend =
            false;


        document.getElementById(
            "status"
        ).innerText =
            "📍 Определяем выбранное место...";


        document.getElementById(
            "routeInfo"
        ).innerText =
            "📏 Расстояние: рассчитывается";


        getAddress(
            selectedLat,
            selectedLon
        );

    }
);


/*
==================================================
МОЁ МЕСТОПОЛОЖЕНИЕ
==================================================
*/

function myLocation() {

    if (
        !navigator.geolocation
    ) {

        document.getElementById(
            "status"
        ).innerText =
            "⚠️ Геолокация недоступна.";

        return;

    }


    document.getElementById(
        "status"
    ).innerText =
        "📍 Получаем местоположение...";


    navigator.geolocation.getCurrentPosition(

        function(position) {

            const lat =
                position.coords.latitude;


            const lon =
                position.coords.longitude;


            selectedLat =
                lat;


            selectedLon =
                lon;


            map.setView(
                [
                    lat,
                    lon
                ],
                16
            );


            marker.setLatLng(
                [
                    lat,
                    lon
                ]
            );


            document.getElementById(
                "status"
            ).innerText =
                "✅ Местоположение найдено";


            getAddress(
                lat,
                lon
            );

        },


        function() {

            document.getElementById(
                "status"
            ).innerText =
                "⚠️ Не удалось получить геопозицию.";

        },


        {

            enableHighAccuracy:
                true,

            timeout:
                15000,

            maximumAge:
                0

        }

    );

}


/*
==================================================
ВЫБОР МЕСТА
==================================================
*/

function choosePlace() {

    if (!tg) {

        document.getElementById(
            "status"
        ).innerText =
            "⚠️ Откройте карту внутри Telegram.";

        return;

    }


    const lat =
        Number(
            selectedLat
        );


    const lon =
        Number(
            selectedLon
        );


    if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lon)
    ) {

        document.getElementById(
            "status"
        ).innerText =
            "⚠️ Сначала выберите место.";

        return;

    }


    let address =
        selectedAddress;


    if (
        !address
    ) {

        address =
            "Точка на карте";

    }


    /*
    ==============================================
    ВАЖНО:
    НЕ КОДИРУЕМ АДРЕС ВРУЧНУЮ.
    Telegram получит обычный текст.
    ==============================================
    */


    const data =
        "DESTINATION"
        +
        "|"
        +
        lat.toFixed(6)
        +
        "|"
        +
        lon.toFixed(6)
        +
        "|"
        +
        address;


    document.getElementById(
        "status"
    ).innerText =
        "📤 Передаём место боту...";


    try {

        tg.sendData(
            data
        );


        document.getElementById(
            "status"
        ).innerText =
            "✅ Место передано боту";


        /*
        Закрываем Mini App
        после успешной передачи.
        */

        setTimeout(
            function() {

                try {

                    tg.close();

                }

                catch (e) {}

            },
            500
        );


    }

    catch (error) {

        document.getElementById(
            "status"
        ).innerText =
            "⚠️ Ошибка передачи данных.";

    }

}


/*
==================================================
ПЕРВИЧНЫЙ АДРЕС
==================================================
*/

getAddress(
    selectedLat,
    selectedLon
);


/*
==================================================
СТАТУС
==================================================
*/

if (tg) {

    document.getElementById(
        "status"
    ).innerText =
        "📍 Выберите место назначения на карте.";

}

</script>

</body>
</html>
