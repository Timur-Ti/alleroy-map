<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Аллерой Доставка — карта</title>

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        #panel {
            position: fixed;
            left: 10px;
            right: 10px;
            bottom: 10px;
            z-index: 1000;

            background: white;

            border-radius: 18px;

            padding: 16px;

            box-shadow:
                0 3px 18px rgba(0,0,0,0.30);
        }

        #info {
            font-size: 16px;
            line-height: 1.45;

            margin-bottom: 10px;
        }

        #distance {
            font-size: 19px;
            font-weight: bold;

            margin-bottom: 12px;
        }

        #sendButton {
            width: 100%;

            border: 0;

            border-radius: 13px;

            padding: 15px;

            font-size: 17px;

            font-weight: bold;

            background: #1683ff;

            color: white;
        }

        #sendButton:disabled {
            background: #999;
        }
    </style>
</head>

<body>

<div id="map"></div>

<div id="panel">

    <div id="info">
        📍 Сначала выберите место назначения на карте.
    </div>

    <div id="distance">
        📏 Расстояние: —
    </div>

    <button
        id="sendButton"
        disabled
    >
        ✅ Выбрать это место
    </button>

</div>


<!-- ==========================================
     LEAFLET
     ========================================== -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<!-- ==========================================
     TELEGRAM WEB APP
     ЭТО БЫЛО ГЛАВНОЙ ПРОБЛЕМОЙ
     ========================================== -->

<script src="https://telegram.org/js/telegram-web-app.js"></script>


<script>

    // ==========================================
    // TELEGRAM WEB APP
    // ==========================================

    let tg = null;

    if (
        window.Telegram
        &&
        window.Telegram.WebApp
    ) {

        tg = window.Telegram.WebApp;

        tg.ready();

        tg.expand();

        try {
            tg.enableClosingConfirmation();
        } catch (error) {
            console.log(error);
        }
    }


    // ==========================================
    // ПАРАМЕТРЫ URL
    // ==========================================

    const params =
        new URLSearchParams(
            window.location.search
        );


    // ==========================================
    // КООРДИНАТЫ ОТПРАВЛЕНИЯ
    // ==========================================

    const fromLat =
        parseFloat(
            params.get("from_lat")
        );

    const fromLon =
        parseFloat(
            params.get("from_lon")
        );


    // ==========================================
    // ПРОВЕРКА TELEGRAM
    // ==========================================

    if (!tg) {

        console.log(
            "Telegram WebApp не найден"
        );

    } else {

        console.log(
            "Telegram WebApp подключен"
        );
    }


    // ==========================================
    // ПРОВЕРКА КООРДИНАТ
    // ==========================================

    if (
        isNaN(fromLat)
        ||
        isNaN(fromLon)
    ) {

        document.getElementById(
            "info"
        ).innerText =
            "⚠️ Не удалось получить место отправления.";
    }


    // ==========================================
    // КАРТА
    // ==========================================

    const map =
        L.map("map").setView(
            [
                isNaN(fromLat)
                    ? 43.2
                    : fromLat,

                isNaN(fromLon)
                    ? 46.28
                    : fromLon
            ],
            14
        );


    // ==========================================
    // OPEN STREET MAP
    // ==========================================

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,

            attribution:
                "© OpenStreetMap"
        }
    ).addTo(map);


    // ==========================================
    // МАРКЕР ОТПРАВЛЕНИЯ
    // ==========================================

    let fromMarker = null;

    if (
        !isNaN(fromLat)
        &&
        !isNaN(fromLon)
    ) {

        fromMarker =
            L.marker(
                [
                    fromLat,
                    fromLon
                ]
            ).addTo(map);

        fromMarker.bindPopup(
            "📍 Место отправления"
        );

        fromMarker.openPopup();
    }


    // ==========================================
    // ПЕРЕМЕННЫЕ
    // ==========================================

    let destinationMarker = null;

    let routeLine = null;

    let destinationLat = null;

    let destinationLon = null;

    let roadDistance = 0;


    // ==========================================
    // КЛИК ПО КАРТЕ
    // ==========================================

    map.on(
        "click",
        async function(e) {

            destinationLat =
                e.latlng.lat;

            destinationLon =
                e.latlng.lng;


            // ==================================
            // МАРКЕР НАЗНАЧЕНИЯ
            // ==================================

            if (
                destinationMarker
            ) {

                map.removeLayer(
                    destinationMarker
                );
            }


            destinationMarker =
                L.marker(
                    [
                        destinationLat,
                        destinationLon
                    ]
                ).addTo(map);


            destinationMarker.bindPopup(
                "🏁 Место назначения"
            );

            destinationMarker.openPopup();


            // ==================================
            // УДАЛЯЕМ СТАРЫЙ МАРШРУТ
            // ==================================

            if (routeLine) {

                map.removeLayer(
                    routeLine
                );

                routeLine = null;
            }


            // ==================================
            // ИНДИКАТОР
            // ==================================

            document.getElementById(
                "info"
            ).innerText =
                "⏳ Рассчитываем маршрут по дороге...";


            document.getElementById(
                "distance"
            ).innerText =
                "📏 Расстояние: рассчитывается...";


            document.getElementById(
                "sendButton"
            ).disabled = true;


            // ==================================
            // ПРОВЕРКА ТОЧКИ А
            // ==================================

            if (
                isNaN(fromLat)
                ||
                isNaN(fromLon)
            ) {

                document.getElementById(
                    "info"
                ).innerText =
                    "⚠️ Нет координат места отправления.";

                return;
            }


            // ==================================
            // OSRM
            // МАРШРУТ ПО ДОРОГЕ
            // ==================================

            const routeUrl =
                "https://router.project-osrm.org/route/v1/driving/"
                +
                fromLon
                +
                ","
                +
                fromLat
                +
                ";"
                +
                destinationLon
                +
                ","
                +
                destinationLat
                +
                "?overview=full&geometries=geojson";


            try {

                const response =
                    await fetch(
                        routeUrl
                    );


                if (
                    !response.ok
                ) {

                    throw new Error(
                        "Ошибка сервера маршрута"
                    );
                }


                const result =
                    await response.json();


                if (
                    !result.routes
                    ||
                    result.routes.length === 0
                ) {

                    throw new Error(
                        "Маршрут не найден"
                    );
                }


                const route =
                    result.routes[0];


                // ==================================
                // РАССТОЯНИЕ
                // ==================================

                roadDistance =
                    route.distance / 1000;


                roadDistance =
                    Math.round(
                        roadDistance * 10
                    ) / 10;


                // ==================================
                // РИСУЕМ МАРШРУТ
                // ==================================

                routeLine =
                    L.geoJSON(
                        route.geometry,
                        {
                            style: {
                                weight: 6
                            }
                        }
                    ).addTo(map);


                // ==================================
                // ПОКАЗЫВАЕМ ВЕСЬ МАРШРУТ
                // ==================================

                map.fitBounds(
                    routeLine.getBounds(),
                    {
                        padding: [
                            30,
                            30
                        ]
                    }
                );


                // ==================================
                // ИНФОРМАЦИЯ
                // ==================================

                document.getElementById(
                    "info"
                ).innerText =
                    "🏁 Место назначения выбрано.";


                document.getElementById(
                    "distance"
                ).innerText =
                    "📏 Расстояние по дороге: "
                    +
                    roadDistance
                    +
                    " км";


                // ==================================
                // РАЗРЕШАЕМ КНОПКУ
                // ==================================

                document.getElementById(
                    "sendButton"
                ).disabled = false;

            }


            catch (error) {

                console.log(
                    "Ошибка маршрута:",
                    error
                );


                roadDistance = 0;


                document.getElementById(
                    "info"
                ).innerText =
                    "⚠️ Не удалось построить маршрут по дороге.";


                document.getElementById(
                    "distance"
                ).innerText =
                    "📏 Расстояние: нет данных";


                document.getElementById(
                    "sendButton"
                ).disabled = true;
            }

        }
    );


    // ==========================================
    // КНОПКА
    // ВЫБРАТЬ ЭТО МЕСТО
    // ==========================================

    document.getElementById(
        "sendButton"
    ).addEventListener(
        "click",
        function() {

            // ==================================
            // ПРОВЕРКА
            // ==================================

            if (
                destinationLat === null
                ||
                destinationLon === null
                ||
                roadDistance <= 0
            ) {

                if (tg) {

                    try {

                        tg.showAlert(
                            "Сначала выберите место назначения и дождитесь расчёта маршрута."
                        );

                    }

                    catch (error) {

                        alert(
                            "Сначала выберите место назначения и дождитесь расчёта маршрута."
                        );
                    }

                }

                else {

                    alert(
                        "Сначала выберите место назначения и дождитесь расчёта маршрута."
                    );
                }

                return;
            }


            // ==================================
            // ДАННЫЕ ДЛЯ TELEBOT CREATOR
            //
            // Формат:
            //
            // DESTINATION|LAT|LON|DISTANCE
            // ==================================

            const data =
                "DESTINATION|"
                +
                destinationLat
                +
                "|"
                +
                destinationLon
                +
                "|"
                +
                roadDistance;


            console.log(
                "Отправляем в Telegram:",
                data
            );


            // ==================================
            // TELEGRAM WEB APP
            // ==================================

            if (
                tg
                &&
                typeof tg.sendData === "function"
            ) {

                try {

                    tg.sendData(
                        data
                    );


                    // Telegram должен получить
                    // данные и закрыть Mini App

                    setTimeout(
                        function() {

                            try {

                                tg.close();

                            }

                            catch (error) {

                                console.log(
                                    "Ошибка закрытия:",
                                    error
                                );
                            }

                        },
                        500
                    );

                }

                catch (error) {

                    console.log(
                        "Ошибка tg.sendData:",
                        error
                    );


                    try {

                        tg.showAlert(
                            "Не удалось передать данные в Telegram."
                        );

                    }

                    catch (e) {

                        alert(
                            "Не удалось передать данные в Telegram."
                        );
                    }
                }

            }

            else {

                // ==================================
                // TELEGRAM НЕ ПОДКЛЮЧЕН
                // ==================================

                alert(
                    "⚠️ Карта открыта не как Telegram Mini App.\n\n"
                    +
                    "Откройте её через кнопку «🗺 Открыть карту» внутри бота."
                );
            }

        }
    );


    // ==========================================
    // ГОТОВО
    // ==========================================

    console.log(
        "Карта Аллерой Доставка загружена."
    );

    console.log(
        "Telegram WebApp:",
        tg
    );

    console.log(
        "Отправление:",
        fromLat,
        fromLon
    );

</script>

</body>
</html>
