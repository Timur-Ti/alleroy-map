<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Аллерой Доставка — карта</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        #panel {
            position: fixed;
            left: 10px;
            right: 10px;
            bottom: 10px;
            z-index: 1000;
            background: white;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.25);
        }

        #info {
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 8px;
        }

        #distance {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 12px;
            padding: 14px;
            font-size: 17px;
            font-weight: bold;
            background: #1683ff;
            color: white;
        }

        button:disabled {
            background: #999;
        }
    </style>
</head>

<body>

<div id="map"></div>

<div id="panel">

    <div id="info">
        📍 Выберите место назначения на карте.
    </div>

    <div id="distance">
        📏 Расстояние: —
    </div>

    <button id="sendButton" disabled>
        ✅ Выбрать это место
    </button>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const tg = window.Telegram
    ? window.Telegram.WebApp
    : null;

if (tg) {
    tg.ready();
    tg.expand();
}


/* ==========================================
   ПОЛУЧАЕМ ТОЧКУ ОТПРАВЛЕНИЯ
   ========================================== */

const params = new URLSearchParams(
    window.location.search
);

const fromLat = parseFloat(
    params.get("from_lat")
);

const fromLon = parseFloat(
    params.get("from_lon")
);


/* ==========================================
   ПРОВЕРКА
   ========================================== */

if (
    isNaN(fromLat) ||
    isNaN(fromLon)
) {

    document.getElementById("info").innerText =
        "⚠️ Не удалось получить точку отправления.";
}


/* ==========================================
   КАРТА
   ========================================== */

const map = L.map("map").setView(
    [
        isNaN(fromLat) ? 43.198 : fromLat,
        isNaN(fromLon) ? 46.278 : fromLon
    ],
    14
);


/* ==========================================
   OPENSTREETMAP
   ========================================== */

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,
        attribution: "© OpenStreetMap"
    }
).addTo(map);


/* ==========================================
   ТОЧКА ОТПРАВЛЕНИЯ
   ========================================== */

let fromMarker = null;

if (
    !isNaN(fromLat) &&
    !isNaN(fromLon)
) {

    fromMarker = L.marker(
        [
            fromLat,
            fromLon
        ]
    ).addTo(map);

    fromMarker.bindPopup(
        "📍 Место отправления"
    );

    fromMarker.openPopup();
}


/* ==========================================
   ПЕРЕМЕННЫЕ
   ========================================== */

let destinationMarker = null;
let routeLine = null;

let destinationLat = null;
let destinationLon = null;

let roadDistance = 0;
let destinationAddress = "Точка назначения";


/* ==========================================
   КЛИК ПО КАРТЕ
   ========================================== */

map.on(
    "click",
    async function(e) {

        destinationLat =
            e.latlng.lat;

        destinationLon =
            e.latlng.lng;


        /* --------------------------------------
           МАРКЕР НАЗНАЧЕНИЯ
           -------------------------------------- */

        if (destinationMarker) {

            map.removeLayer(
                destinationMarker
            );
        }

        destinationMarker =
            L.marker(
                [
                    destinationLat,
                    destinationLon
                ]
            )
            .addTo(map);

        destinationMarker.bindPopup(
            "🏁 Место назначения"
        );

        destinationMarker.openPopup();


        /* --------------------------------------
           СТАРЫЙ МАРШРУТ
           -------------------------------------- */

        if (routeLine) {

            map.removeLayer(
                routeLine
            );

            routeLine = null;
        }


        document.getElementById(
            "info"
        ).innerText =
            "⏳ Рассчитываем маршрут по дороге...";

        document.getElementById(
            "distance"
        ).innerText =
            "📏 Расстояние: рассчитывается...";

        document.getElementById(
            "sendButton"
        ).disabled = true;


        /* ======================================
           OSRM — РАСЧЁТ ПО ДОРОГЕ
           ====================================== */

        const routeUrl =
            "https://router.project-osrm.org/route/v1/driving/"
            +
            fromLon
            +
            ","
            +
            fromLat
            +
            ";"
            +
            destinationLon
            +
            ","
            +
            destinationLat
            +
            "?overview=full&geometries=geojson";


        try {

            const response =
                await fetch(routeUrl);

            if (!response.ok) {

                throw new Error(
                    "Ошибка сервера маршрута"
                );
            }

            const result =
                await response.json();


            if (
                !result.routes ||
                result.routes.length === 0
            ) {

                throw new Error(
                    "Маршрут не найден"
                );
            }


            const route =
                result.routes[0];


            /* ----------------------------------
               РАССТОЯНИЕ ПО ДОРОГЕ
               ---------------------------------- */

            roadDistance =
                route.distance / 1000;

            roadDistance =
                Math.round(
                    roadDistance * 10
                ) / 10;


            /* ----------------------------------
               РИСУЕМ МАРШРУТ
               ---------------------------------- */

            routeLine =
                L.geoJSON(
                    route.geometry,
                    {
                        style: {
                            weight: 6
                        }
                    }
                ).addTo(map);


            map.fitBounds(
                routeLine.getBounds(),
                {
                    padding: [30, 30]
                }
            );


            /* ==================================
               ПОЛУЧАЕМ АДРЕС
               ================================== */

            try {

                const reverseUrl =
                    "https://nominatim.openstreetmap.org/reverse"
                    +
                    "?format=json"
                    +
                    "&lat="
                    +
                    destinationLat
                    +
                    "&lon="
                    +
                    destinationLon
                    +
                    "&zoom=18"
                    +
                    "&addressdetails=1"
                    +
                    "&accept-language=ru";

                const reverseResponse =
                    await fetch(
                        reverseUrl,
                        {
                            headers: {
                                "Accept": "application/json"
                            }
                        }
                    );

                if (reverseResponse.ok) {

                    const reverseData =
                        await reverseResponse.json();

                    if (
                        reverseData &&
                        reverseData.display_name
                    ) {

                        destinationAddress =
                            reverseData.display_name;
                    }
                }

            } catch(addressError) {

                destinationAddress =
                    "Точка назначения";
            }


            /* ----------------------------------
               ПОКАЗЫВАЕМ РЕЗУЛЬТАТ
               ---------------------------------- */

            document.getElementById(
                "info"
            ).innerText =
                "🏁 Место назначения выбрано.";

            document.getElementById(
                "distance"
            ).innerText =
                "📏 Расстояние по дороге: "
                +
                roadDistance
                +
                " км";

            document.getElementById(
                "sendButton"
            ).disabled = false;


        } catch(error) {

            console.log(error);

            document.getElementById(
                "info"
            ).innerText =
                "⚠️ Не удалось построить маршрут.";

            document.getElementById(
                "distance"
            ).innerText =
                "📏 Расстояние: нет данных";

            document.getElementById(
                "sendButton"
            ).disabled = true;
        }

    }
);


/* ==========================================
   ОТПРАВКА В TELEGRAM
   ========================================== */

document.getElementById(
    "sendButton"
).addEventListener(
    "click",
    function() {

        if (
            destinationLat === null ||
            destinationLon === null ||
            roadDistance <= 0
        ) {

            alert(
                "Сначала выберите место назначения и дождитесь расчёта маршрута."
            );

            return;
        }


        /* ==================================
           ФОРМАТ:

           DESTINATION
           LAT
           LON
           ADDRESS
           DISTANCE
           ================================== */

        const encodedAddress =
            encodeURIComponent(
                destinationAddress
            );

        const data =
            "DESTINATION|"
            +
            destinationLat
            +
            "|"
            +
            destinationLon
            +
            "|"
            +
            encodedAddress
            +
            "|"
            +
            roadDistance;


        if (tg) {

            tg.sendData(
                data
            );

            setTimeout(
                function() {

                    tg.close();

                },
                500
            );

        } else {

            alert(
                "⚠️ Откройте карту через Telegram."
            );
        }

    }
);

</script>

</body>
</html>
