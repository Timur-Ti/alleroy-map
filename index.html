<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Аллерой Доставка</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    font-family: Arial, sans-serif;

    overflow: hidden;
}

#map {

    width: 100%;
    height: 100%;
}

.top-panel {

    position: fixed;

    top: 10px;
    left: 10px;
    right: 10px;

    z-index: 1000;

    background: white;

    border-radius: 15px;

    padding: 12px;

    box-shadow:
        0 3px 15px
        rgba(0,0,0,0.25);
}

.title {

    font-size: 18px;

    font-weight: bold;

    margin-bottom: 6px;
}

.address {

    font-size: 14px;

    color: #333;

    line-height: 1.35;
}

.bottom-panel {

    position: fixed;

    left: 10px;
    right: 10px;

    bottom: 15px;

    z-index: 1000;
}

button {

    width: 100%;

    border: none;

    border-radius: 15px;

    padding: 16px;

    margin-top: 8px;

    font-size: 17px;

    font-weight: bold;
}

.choose-button {

    background: #1687ff;

    color: white;

    box-shadow:
        0 3px 15px
        rgba(0,0,0,0.25);
}

.status {

    background: white;

    border-radius: 12px;

    padding: 10px;

    margin-bottom: 8px;

    text-align: center;

    box-shadow:
        0 3px 15px
        rgba(0,0,0,0.20);

    font-size: 14px;
}

.distance {

    background: white;

    border-radius: 12px;

    padding: 10px;

    margin-bottom: 8px;

    text-align: center;

    box-shadow:
        0 3px 15px
        rgba(0,0,0,0.20);

    font-size: 15px;

    font-weight: bold;
}

</style>

</head>

<body>


<div class="top-panel">

    <div class="title">

        🚚 Аллерой Доставка

    </div>

    <div
        class="address"
        id="address"
    >

        📍 Выберите место назначения

    </div>

</div>


<div id="map"></div>


<div class="bottom-panel">

    <div
        class="status"
        id="status"
    >

        📍 Переместите карту

    </div>

    <div
        class="distance"
        id="distance"
    >

        📏 Расстояние: определяем...

    </div>

    <button
        class="choose-button"
        onclick="choosePlace()"
    >

        ✅ Выбрать это место

    </button>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

let tg = null;

if (
    window.Telegram &&
    window.Telegram.WebApp
) {

    tg = window.Telegram.WebApp;

    tg.ready();

    tg.expand();
}


const defaultLat = 43.214527;

const defaultLon = 46.277579;


const map = L.map(
    "map"
).setView(
    [
        defaultLat,
        defaultLon
    ],
    14
);


L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {

        maxZoom: 19,

        attribution:
            "&copy; OpenStreetMap"

    }
).addTo(map);


let marker = L.marker(
    [
        defaultLat,
        defaultLon
    ]
).addTo(map);


let selectedLat =
    defaultLat;

let selectedLon =
    defaultLon;


let selectedAddress =
    "Точка на карте";


let routeDistance =
    0;


let routeLine =
    null;


function setStatus(text) {

    document.getElementById(
        "status"
    ).innerText = text;

}


function setAddress(text) {

    document.getElementById(
        "address"
    ).innerText = text;

}


function setDistance(text) {

    document.getElementById(
        "distance"
    ).innerText = text;

}


map.on(
    "move",
    function() {

        const center =
            map.getCenter();

        selectedLat =
            center.lat;

        selectedLon =
            center.lng;

        marker.setLatLng(
            [
                selectedLat,
                selectedLon
            ]
        );

    }
);


map.on(
    "moveend",
    function() {

        const center =
            map.getCenter();

        selectedLat =
            center.lat;

        selectedLon =
            center.lng;

        marker.setLatLng(
            [
                selectedLat,
                selectedLon
            ]
        );

        getAddress();

        calculateRoute();

    }
);


function getAddress() {

    setAddress(
        "📍 Определяем адрес..."
    );


    const url =
        "https://nominatim.openstreetmap.org/reverse"
        +
        "?format=json"
        +
        "&lat="
        + encodeURIComponent(
            selectedLat
        )
        +
        "&lon="
        + encodeURIComponent(
            selectedLon
        )
        +
        "&zoom=18"
        +
        "&addressdetails=1";


    fetch(url)

    .then(
        function(response) {

            return response.json();

        }
    )

    .then(
        function(data) {

            if (
                data &&
                data.display_name
            ) {

                selectedAddress =
                    data.display_name;

                setAddress(
                    "📍 "
                    +
                    selectedAddress
                );

            }

            else {

                selectedAddress =
                    "Точка на карте";

                setAddress(
                    "📍 Точка на карте"
                );

            }

        }
    )

    .catch(
        function() {

            selectedAddress =
                "Точка на карте";

            setAddress(
                "📍 Точка на карте"
            );

        }
    );

}


function calculateRoute() {

    setStatus(
        "🛣️ Рассчитываем маршрут..."
    );

    setDistance(
        "📏 Расстояние: рассчитываем..."
    );


    const fromLat =
        tg &&
        tg.initDataUnsafe &&
        tg.initDataUnsafe.start_param
        ?
        null
        :
        null;


    /*
    ======================================
    ВАЖНО
    ======================================

    Координаты отправления передаются
    в Mini App через URL.

    Если URL содержит:

    ?fromLat=...
    ?fromLon=...

    используем их.

    ======================================
    */


    const params =
        new URLSearchParams(
            window.location.search
        );


    let startLat =
        parseFloat(
            params.get("fromLat")
        );

    let startLon =
        parseFloat(
            params.get("fromLon")
        );


    /*
    Если координаты отправления
    не передались, используем
    текущую точку как запасной вариант.
    */

    if (
        !Number.isFinite(startLat)
        ||
        !Number.isFinite(startLon)
    ) {

        setStatus(
            "⚠️ Не получена точка отправления"
        );

        setDistance(
            "📏 Расстояние: нет данных"
        );

        routeDistance = 0;

        return;
    }


    const url =
        "https://router.project-osrm.org/route/v1/driving/"
        +
        startLon
        +
        ","
        +
        startLat
        +
        ";"
        +
        selectedLon
        +
        ","
        +
        selectedLat
        +
        "?overview=full"
        +
        "&geometries=geojson";


    fetch(url)

    .then(
        function(response) {

            return response.json();

        }
    )

    .then(
        function(data) {

            if (
                data &&
                data.code === "Ok"
                &&
                data.routes
                &&
                data.routes.length > 0
            ) {

                const route =
                    data.routes[0];


                routeDistance =
                    route.distance
                    / 1000;


                routeDistance =
                    Math.round(
                        routeDistance * 10
                    ) / 10;


                setDistance(
                    "📏 По дороге: "
                    +
                    routeDistance
                    +
                    " км"
                );


                setStatus(
                    "✅ Маршрут рассчитан"
                );


                if (routeLine) {

                    map.removeLayer(
                        routeLine
                    );

                }


                routeLine =
                    L.geoJSON(
                        route.geometry
                    ).addTo(map);

            }

            else {

                routeDistance = 0;

                setStatus(
                    "⚠️ Маршрут не найден"
                );

                setDistance(
                    "📏 Расстояние: нет маршрута"
                );

            }

        }
    )

    .catch(
        function() {

            routeDistance = 0;

            setStatus(
                "⚠️ Ошибка расчёта маршрута"
            );

            setDistance(
                "📏 Расстояние: нет данных"
            );

        }
    );

}


function choosePlace() {

    if (
        !tg
    ) {

        setStatus(
            "⚠️ Карта открыта не в Telegram"
        );

        return;
    }


    if (
        !routeDistance
        ||
        routeDistance <= 0
    ) {

        setStatus(
            "⚠️ Сначала дождитесь расчёта маршрута"
        );

        return;
    }


    setStatus(
        "📤 Передаём заказ боту..."
    );


    const data =
        "ROUTE"
        +
        "|"
        +
        selectedLat.toFixed(6)
        +
        "|"
        +
        selectedLon.toFixed(6)
        +
        "|"
        +
        routeDistance.toFixed(1)
        +
        "|"
        +
        encodeURIComponent(
            selectedAddress
        );


    /*
    Исправленный формат:

    ROUTE|
    latitude|
    longitude|
    distance|
    address
    */


    const finalData =
        "ROUTE"
        +
        "|"
        +
        selectedLat.toFixed(6)
        +
        "|"
        +
        selectedLon.toFixed(6)
        +
        "|"
        +
        "unused"
        +
        "|"
        +
        "unused"
        +
        "|"
        +
        routeDistance.toFixed(1)
        +
        "|"
        +
        encodeURIComponent(
            selectedAddress
        );


    tg.sendData(
        finalData
    );

}


getAddress();

</script>

</body>

</html>
