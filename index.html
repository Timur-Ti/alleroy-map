<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Аллерой Доставка — Карта</title>

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #ffffff;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .top-panel {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            z-index: 1000;
            background: white;
            border-radius: 14px;
            padding: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.25);
        }

        .title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .address {
            font-size: 14px;
            color: #333333;
            min-height: 20px;
        }

        .bottom-panel {
            position: fixed;
            left: 10px;
            right: 10px;
            bottom: 15px;
            z-index: 1000;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 15px;
            margin-top: 8px;
            font-size: 17px;
            font-weight: bold;
        }

        .location-button {
            background: #ffffff;
            box-shadow: 0 3px 15px rgba(0,0,0,0.25);
        }

        .choose-button {
            background: #1687ff;
            color: white;
            box-shadow: 0 3px 15px rgba(0,0,0,0.25);
        }

        .status {
            background: white;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 8px;
            text-align: center;
            box-shadow: 0 3px 15px rgba(0,0,0,0.20);
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="top-panel">

    <div class="title">
        🚚 Аллерой Доставка
    </div>

    <div class="address" id="address">
        📍 Переместите карту и выберите место
    </div>

</div>

<div id="map"></div>

<div class="bottom-panel">

    <div
        class="status"
        id="status"
    >
        📍 Определяем ваше местоположение...
    </div>

    <button
        class="location-button"
        onclick="myLocation()"
    >
        📍 Моё местоположение
    </button>

    <button
        class="choose-button"
        onclick="choosePlace()"
    >
        ✅ Выбрать это место
    </button>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

    /* ==========================================
       TELEGRAM MINI APP
       ========================================== */

    const tg = window.Telegram
        ? window.Telegram.WebApp
        : null;

    if (tg) {

        try {
            tg.ready();
            tg.expand();
        } catch (e) {
        }

    }


    /* ==========================================
       НАЧАЛЬНЫЕ КООРДИНАТЫ
       ========================================== */

    const defaultLat = 43.3178;
    const defaultLon = 45.6980;


    /* ==========================================
       КАРТА
       ========================================== */

    const map = L.map(
        "map",
        {
            zoomControl: true
        }
    ).setView(
        [
            defaultLat,
            defaultLon
        ],
        13
    );


    /* ==========================================
       OPENSTREETMAP
       ========================================== */

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,

            attribution:
                "&copy; OpenStreetMap"
        }
    ).addTo(map);


    /* ==========================================
       ЦЕНТРАЛЬНЫЙ МАРКЕР
       ========================================== */

    let marker = L.marker(
        [
            defaultLat,
            defaultLon
        ]
    ).addTo(map);


    /* ==========================================
       ВЫБРАННАЯ ТОЧКА
       ========================================== */

    let selectedLat = defaultLat;
    let selectedLon = defaultLon;

    let selectedAddress =
        "Точка на карте";


    /* ==========================================
       ПЕРЕМЕЩЕНИЕ КАРТЫ
       ========================================== */

    map.on(
        "move",
        function () {

            const center =
                map.getCenter();

            selectedLat =
                center.lat;

            selectedLon =
                center.lng;

            marker.setLatLng(
                [
                    selectedLat,
                    selectedLon
                ]
            );

        }
    );


    /* ==========================================
       КАРТА ОСТАНОВИЛАСЬ
       ========================================== */

    map.on(
        "moveend",
        function () {

            const center =
                map.getCenter();

            selectedLat =
                center.lat;

            selectedLon =
                center.lng;

            marker.setLatLng(
                [
                    selectedLat,
                    selectedLon
                ]
            );

            getAddress(
                selectedLat,
                selectedLon
            );

        }
    );


    /* ==========================================
       ПОЛУЧЕНИЕ АДРЕСА
       ========================================== */

    function getAddress(
        lat,
        lon
    ) {

        document.getElementById(
            "address"
        ).innerText =
            "📍 Определяем адрес...";


        const url =
            "https://nominatim.openstreetmap.org/reverse"
            +
            "?format=json"
            +
            "&lat="
            + encodeURIComponent(lat)
            +
            "&lon="
            + encodeURIComponent(lon)
            +
            "&zoom=18"
            +
            "&addressdetails=1"
            +
            "&accept-language=ru";


        fetch(
            url
        )

        .then(
            function(response) {

                if (!response.ok) {
                    throw new Error("Address error");
                }

                return response.json();

            }
        )

        .then(
            function(data) {

                if (
                    data &&
                    data.display_name
                ) {

                    selectedAddress =
                        data.display_name;

                    document.getElementById(
                        "address"
                    ).innerText =
                        "📍 "
                        +
                        selectedAddress;

                }

                else {

                    selectedAddress =
                        "Точка на карте";

                    document.getElementById(
                        "address"
                    ).innerText =
                        "📍 Точка на карте";

                }

            }
        )

        .catch(
            function() {

                selectedAddress =
                    "Точка на карте";

                document.getElementById(
                    "address"
                ).innerText =
                    "📍 Точка на карте";

            }
        );

    }


    /* ==========================================
       МОЁ МЕСТОПОЛОЖЕНИЕ
       ========================================== */

    function myLocation() {

        if (
            !navigator.geolocation
        ) {

            document.getElementById(
                "status"
            ).innerText =
                "⚠️ Геолокация недоступна.";

            return;

        }


        document.getElementById(
            "status"
        ).innerText =
            "📍 Получаем ваше местоположение...";


        navigator.geolocation.getCurrentPosition(

            function(position) {

                const lat =
                    position.coords.latitude;

                const lon =
                    position.coords.longitude;


                selectedLat =
                    lat;

                selectedLon =
                    lon;


                marker.setLatLng(
                    [
                        lat,
                        lon
                    ]
                );


                map.setView(
                    [
                        lat,
                        lon
                    ],
                    16
                );


                document.getElementById(
                    "status"
                ).innerText =
                    "✅ Местоположение найдено";


                getAddress(
                    lat,
                    lon
                );

            },

            function() {

                document.getElementById(
                    "status"
                ).innerText =
                    "⚠️ Не удалось получить геопозицию.";

            },

            {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            }

        );

    }


    /* ==========================================
       ВЫБРАТЬ МЕСТО
       ========================================== */

    function choosePlace() {

        const lat =
            Number(selectedLat);

        const lon =
            Number(selectedLon);


        if (
            !Number.isFinite(lat) ||
            !Number.isFinite(lon)
        ) {

            document.getElementById(
                "status"
            ).innerText =
                "⚠️ Сначала выберите место.";

            return;

        }


        let address =
            selectedAddress;


        if (
            !address ||
            address === "Адрес определяется..." ||
            address === "Адрес не найден" ||
            address === "Адрес не определён"
        ) {

            address =
                "Точка на карте";

        }


        /* ======================================
           ДАННЫЕ ДЛЯ TELEGRAM
           ====================================== */

        const data =
            "DESTINATION"
            +
            "|"
            +
            lat.toFixed(6)
            +
            "|"
            +
            lon.toFixed(6)
            +
            "|"
            +
            encodeURIComponent(address);


        /* ======================================
           ОТПРАВКА В БОТ
           ====================================== */

        if (
            tg &&
            typeof tg.sendData === "function"
        ) {

            document.getElementById(
                "status"
            ).innerText =
                "✅ Передаём выбранное место...";


            try {

                tg.sendData(
                    data
                );

                setTimeout(
                    function() {

                        try {
                            tg.close();
                        } catch (e) {
                        }

                    },
                    300

                );

            }

            catch (e) {

                document.getElementById(
                    "status"
                ).innerText =
                    "⚠️ Не удалось передать точку.";

            }

        }

        else {

            document.getElementById(
                "status"
            ).innerText =
                "⚠️ Откройте карту кнопкой из Telegram.";

        }

    }


    /* ==========================================
       ПЕРВИЧНЫЙ АДРЕС
       ========================================== */

    getAddress(
        selectedLat,
        selectedLon
    );


</script>

</body>
</html>
