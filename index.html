<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Аллерой Доставка</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#map {
    width: 100%;
    height: 100%;
}

.top-panel {
    position: fixed;
    top: 10px;
    left: 10px;
    right: 10px;
    z-index: 1000;
    background: white;
    border-radius: 15px;
    padding: 12px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.25);
}

.title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 6px;
}

.address {
    font-size: 14px;
    color: #333;
    line-height: 1.35;
}

.distance {
    margin-top: 6px;
    font-size: 15px;
    font-weight: bold;
}

.bottom-panel {
    position: fixed;
    left: 10px;
    right: 10px;
    bottom: 15px;
    z-index: 1000;
}

button {
    width: 100%;
    border: none;
    border-radius: 15px;
    padding: 16px;
    margin-top: 8px;
    font-size: 17px;
    font-weight: bold;
}

.location-button {
    background: white;
    box-shadow: 0 3px 15px rgba(0,0,0,0.25);
}

.choose-button {
    background: #1687ff;
    color: white;
    box-shadow: 0 3px 15px rgba(0,0,0,0.25);
}

.choose-button:disabled {
    background: #999;
}

.cancel-button {
    background: #eeeeee;
}

.status {
    background: white;
    border-radius: 12px;
    padding: 10px;
    margin-bottom: 8px;
    text-align: center;
    box-shadow: 0 3px 15px rgba(0,0,0,0.20);
    font-size: 14px;
}

</style>
</head>

<body>

<div class="top-panel">

    <div class="title">
        🚚 Аллерой Доставка
    </div>

    <div class="address" id="address">
        📍 Переместите карту и выберите место
    </div>

    <div class="distance" id="distance">
        📏 Расстояние: рассчитываем...
    </div>

</div>

<div id="map"></div>

<div class="bottom-panel">

    <div class="status" id="status">
        📍 Выберите место назначения
    </div>

    <button
        class="location-button"
        onclick="myLocation()">
        📍 Моё местоположение
    </button>

    <button
        class="choose-button"
        id="chooseButton"
        onclick="choosePlace()"
        disabled>
        ⏳ Рассчитываем маршрут...
    </button>

    <button
        class="cancel-button"
        onclick="cancelMap()">
        ❌ Отмена
    </button>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* ==========================================
   TELEGRAM
========================================== */

let tg = null;

if (
    window.Telegram &&
    window.Telegram.WebApp
) {

    tg = window.Telegram.WebApp;

    tg.ready();

    tg.expand();

}


/* ==========================================
   ПОЛУЧАЕМ ТОЧКУ ОТПРАВЛЕНИЯ ИЗ URL
========================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

let fromLat =
    parseFloat(
        params.get("from_lat")
    );

let fromLon =
    parseFloat(
        params.get("from_lon")
    );


/* ==========================================
   ЕСЛИ КООРДИНАТЫ НЕ ПЕРЕДАЛИСЬ
========================================== */

if (
    !Number.isFinite(fromLat) ||
    !Number.isFinite(fromLon)
) {

    /*
       Запасная точка.
       Аллерой.
    */

    fromLat = 43.198432;
    fromLon = 46.278875;

}


/* ==========================================
   НАЧАЛЬНАЯ ТОЧКА
========================================== */

const defaultLat =
    fromLat;

const defaultLon =
    fromLon;


/* ==========================================
   КАРТА
========================================== */

const map =
    L.map("map")
    .setView(
        [
            defaultLat,
            defaultLon
        ],
        14
    );


/* ==========================================
   OPEN STREET MAP
========================================== */

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,
        attribution:
            "&copy; OpenStreetMap"
    }
).addTo(map);


/* ==========================================
   МАРКЕР НАЗНАЧЕНИЯ
========================================== */

let marker =
    L.marker(
        [
            defaultLat,
            defaultLon
        ]
    ).addTo(map);


/* ==========================================
   МАРКЕР ОТПРАВЛЕНИЯ
========================================== */

let fromMarker =
    L.marker(
        [
            fromLat,
            fromLon
        ]
    ).addTo(map);


/* ==========================================
   ЛИНИЯ МАРШРУТА
========================================== */

let routeLine = null;


/* ==========================================
   ВЫБРАННЫЕ ДАННЫЕ
========================================== */

let selectedLat =
    defaultLat;

let selectedLon =
    defaultLon;

let selectedAddress =
    "Точка на карте";

let routeDistanceKm =
    null;

let routeReady =
    false;


/* ==========================================
   ПЕРВИЧНЫЙ СТАТУС
========================================== */

document.getElementById(
    "status"
).innerText =
    "📍 Переместите карту на место назначения";


/* ==========================================
   ДВИЖЕНИЕ КАРТЫ
========================================== */

map.on(
    "move",
    function() {

        const center =
            map.getCenter();

        selectedLat =
            center.lat;

        selectedLon =
            center.lng;

        marker.setLatLng(
            [
                selectedLat,
                selectedLon
            ]
        );

    }
);


/* ==========================================
   ОСТАНОВКА КАРТЫ
========================================== */

map.on(
    "moveend",
    function() {

        const center =
            map.getCenter();

        selectedLat =
            center.lat;

        selectedLon =
            center.lng;

        marker.setLatLng(
            [
                selectedLat,
                selectedLon
            ]
        );

        routeReady = false;

        document.getElementById(
            "chooseButton"
        ).disabled = true;

        document.getElementById(
            "chooseButton"
        ).innerText =
            "⏳ Рассчитываем маршрут...";

        getAddress(
            selectedLat,
            selectedLon
        );

        calculateRoute(
            selectedLat,
            selectedLon
        );

    }
);


/* ==========================================
   ПОЛУЧЕНИЕ АДРЕСА
========================================== */

function getAddress(
    lat,
    lon
) {

    document.getElementById(
        "address"
    ).innerText =
        "📍 Определяем адрес...";


    const url =
        "https://nominatim.openstreetmap.org/reverse"
        +
        "?format=json"
        +
        "&lat="
        + encodeURIComponent(lat)
        +
        "&lon="
        + encodeURIComponent(lon)
        +
        "&zoom=18"
        +
        "&addressdetails=1";


    fetch(url)

    .then(
        function(response) {
            return response.json();
        }
    )

    .then(
        function(data) {

            if (
                data &&
                data.display_name
            ) {

                selectedAddress =
                    data.display_name;

                document.getElementById(
                    "address"
                ).innerText =
                    "📍 "
                    +
                    selectedAddress;

            }
            else {

                selectedAddress =
                    "Точка на карте";

                document.getElementById(
                    "address"
                ).innerText =
                    "📍 Точка на карте";

            }

        }
    )

    .catch(
        function() {

            selectedAddress =
                "Точка на карте";

            document.getElementById(
                "address"
            ).innerText =
                "📍 Точка на карте";

        }
    );

}


/* ==========================================
   РАСЧЁТ РАССТОЯНИЯ ПО КООРДИНАТАМ
   ЗАПАСНОЙ ВАРИАНТ
========================================== */

function straightDistanceKm(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R =
        6371;

    const dLat =
        (
            lat2 - lat1
        )
        *
        Math.PI
        /
        180;

    const dLon =
        (
            lon2 - lon1
        )
        *
        Math.PI
        /
        180;

    const a =
        Math.sin(
            dLat / 2
        )
        *
        Math.sin(
            dLat / 2
        )
        +
        Math.cos(
            lat1 * Math.PI / 180
        )
        *
        Math.cos(
            lat2 * Math.PI / 180
        )
        *
        Math.sin(
            dLon / 2
        )
        *
        Math.sin(
            dLon / 2
        );

    const c =
        2
        *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );

    return R * c;

}


/* ==========================================
   РАСЧЁТ МАРШРУТА OSRM
========================================== */

function calculateRoute(
    toLat,
    toLon
) {

    document.getElementById(
        "distance"
    ).innerText =
        "📏 Расстояние: рассчитываем...";


    const url =
        "https://router.project-osrm.org/route/v1/driving/"
        +
        fromLon
        +
        ","
        +
        fromLat
        +
        ";"
        +
        toLon
        +
        ","
        +
        toLat
        +
        "?overview=full"
        +
        "&geometries=geojson";


    fetch(url)

    .then(
        function(response) {

            if (!response.ok) {
                throw new Error(
                    "OSRM error"
                );
            }

            return response.json();

        }
    )

    .then(
        function(data) {

            if (
                data &&
                data.routes &&
                data.routes.length > 0
            ) {

                const route =
                    data.routes[0];

                routeDistanceKm =
                    route.distance / 1000;


                document.getElementById(
                    "distance"
                ).innerText =
                    "📏 Расстояние: "
                    +
                    routeDistanceKm.toFixed(1)
                    +
                    " км";


                if (
                    route.geometry &&
                    route.geometry.coordinates
                ) {

                    const coordinates =
                        route.geometry.coordinates
                        .map(
                            function(point) {

                                return [
                                    point[1],
                                    point[0]
                                ];

                            }
                        );


                    if (routeLine) {

                        map.removeLayer(
                            routeLine
                        );

                    }


                    routeLine =
                        L.polyline(
                            coordinates,
                            {
                                weight: 5
                            }
                        ).addTo(map);

                }


                routeReady =
                    true;

                document.getElementById(
                    "chooseButton"
                ).disabled = false;

                document.getElementById(
                    "chooseButton"
                ).innerText =
                    "✅ Выбрать это место";

                document.getElementById(
                    "status"
                ).innerText =
                    "✅ Маршрут рассчитан";

            }
            else {

                useFallbackDistance(
                    toLat,
                    toLon
                );

            }

        }
    )

    .catch(
        function() {

            useFallbackDistance(
                toLat,
                toLon
            );

        }
    );

}


/* ==========================================
   ЗАПАСНОЙ РАСЧЁТ
========================================== */

function useFallbackDistance(
    toLat,
    toLon
) {

    const distance =
        straightDistanceKm(
            fromLat,
            fromLon,
            toLat,
            toLon
        );


    /*
       Умножаем на 1.25,
       чтобы приблизительно учитывать
       дорожный путь вместо прямой линии.
    */

    routeDistanceKm =
        distance * 1.25;


    document.getElementById(
        "distance"
    ).innerText =
        "📏 Расстояние: "
        +
        routeDistanceKm.toFixed(1)
        +
        " км";


    routeReady =
        true;


    document.getElementById(
        "chooseButton"
    ).disabled = false;

    document.getElementById(
        "chooseButton"
    ).innerText =
        "✅ Выбрать это место";

    document.getElementById(
        "status"
    ).innerText =
        "✅ Расстояние рассчитано";


}


/* ==========================================
   МОЁ МЕСТОПОЛОЖЕНИЕ
========================================== */

function myLocation() {

    if (
        !navigator.geolocation
    ) {

        document.getElementById(
            "status"
        ).innerText =
            "⚠️ Геолокация недоступна.";

        return;

    }


    document.getElementById(
        "status"
    ).innerText =
        "📍 Получаем местоположение...";


    navigator.geolocation.getCurrentPosition(

        function(position) {

            const lat =
                position.coords.latitude;

            const lon =
                position.coords.longitude;


            /*
               Здесь пользователь выбирает
               новое место назначения.
            */

            map.setView(
                [
                    lat,
                    lon
                ],
                16
            );


            selectedLat =
                lat;

            selectedLon =
                lon;


            marker.setLatLng(
                [
                    lat,
                    lon
                ]
            );


            document.getElementById(
                "status"
            ).innerText =
                "📍 Местоположение найдено";


            getAddress(
                lat,
                lon
            );


            calculateRoute(
                lat,
                lon
            );

        },

        function() {

            document.getElementById(
                "status"
            ).innerText =
                "⚠️ Не удалось получить геопозицию.";

        },

        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }

    );

}


/* ==========================================
   ВЫБРАТЬ МЕСТО
========================================== */

function choosePlace() {

    if (
        !routeReady ||
        !Number.isFinite(
            routeDistanceKm
        )
    ) {

        document.getElementById(
            "status"
        ).innerText =
            "⚠️ Сначала дождитесь расчёта маршрута.";

        return;

    }


    const lat =
        Number(selectedLat);

    const lon =
        Number(selectedLon);


    if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lon)
    ) {

        document.getElementById(
            "status"
        ).innerText =
            "⚠️ Не удалось определить точку.";

        return;

    }


    if (!tg) {

        document.getElementById(
            "status"
        ).innerText =
            "⚠️ Карта открыта не как Telegram Mini App.";

        return;

    }


    let address =
        selectedAddress;


    if (
        !address ||
        address === "Точка на карте"
    ) {

        address =
            "Точка на карте";

    }


    const encodedAddress =
        encodeURIComponent(
            address
        );


    /*
       Передаём:
       DESTINATION
       широта
       долгота
       адрес
       расстояние
    */

    const data =
        "DESTINATION"
        +
        "|"
        +
        lat.toFixed(6)
        +
        "|"
        +
        lon.toFixed(6)
        +
        "|"
        +
        encodedAddress
        +
        "|"
        +
        routeDistanceKm.toFixed(2);


    document.getElementById(
        "status"
    ).innerText =
        "📤 Передаём данные боту...";


    try {

        tg.sendData(
            data
        );

    }

    catch (error) {

        document.getElementById(
            "status"
        ).innerText =
            "⚠️ Ошибка отправки данных.";

    }

}


/* ==========================================
   ОТМЕНА
========================================== */

function cancelMap() {

    if (tg) {

        tg.sendData(
            "CANCEL"
        );

    }

}


/* ==========================================
   ПЕРВИЧНЫЙ АДРЕС И РАСЧЁТ
========================================== */

getAddress(
    selectedLat,
    selectedLon
);

calculateRoute(
    selectedLat,
    selectedLon
);

</script>

</body>
</html>
